    title: 00878 年化 14% 能當真嗎？
    stance: neutral
    summary: >
      第四季配 1.25 元、連三季創新高，11/16 最後買進日。用 11/13 收盤 33.6 元算，單次配息率 3.72%，乘 4 是 14.88%，
      但前提是後三季都配一樣多。配息會動態調整（2024/11 配 0.55 元後一路降到 0.4 元），像年終獎金不能年年照算。
      較穩的算法是近四次實際合計 3.34 元 ≈ 9.94%。編生活預算用近四次數字，配息創高別當成買進唯一理由，要看總報酬。

