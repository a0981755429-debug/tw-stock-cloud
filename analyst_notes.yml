  # ---- 美股 / 產業 ----
  - stock: "AMAT"
    author: 自己整理（應用材料 Q4 法說）
    date: 2026-11-16
    title: 應材 Q4 創紀錄，瓶頸仍是無塵室；市場是否已定價？
    stance: bull
    summary: >
      Q4 營收 qoq +14%、yoy +53%，史上最大單季增幅；半導體系統 80 億美元 yoy +64%，韓國、台灣營收創高，
      DRAM、先進封裝與沉積、蝕刻、CMP、製程控制全數創紀錄。Q1 FY2027 財測營收 111 億美元（yoy +58%）、
      EPS 4.35、毛利率 50.8%。2026 半導體系統 yoy +40%（年初預期 +20%），先進封裝 +90%（HBM）。
      2027 WFE 估 +30%，上限由無塵室決定，能見度到 2029–2030；客戶沒有延後、反而要求提前交機。
      AI 資料中心資本支出約 60% 是矽，其中 85% 以上在先進邏輯、DRAM、先進封裝，預計貢獻 2030 年前約 75% WFE 成長。
      先進邏輯、DRAM 滿載，NAND 接近滿載，成熟製程回到健康水位、2027 恢復成長；中國占比 2027 降到 25% 以下。
      DRAM 走向 4F2 / 3D DRAM，HBM 下一步是更大封裝與多晶片互連。資料中心若放緩，PC、手機、電視供給不足可吸收產能。
      我的疑問：這些是人盡皆知的訊息，股價是否已反映，還是後面營收兌現才會表現？

