name: 暫時：分析師資料來源測試
on:
  push:
    branches: [claude/project-thread-djaohg]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m stockapp.analysts
      - run: |
          python - <<'PY'
          import json
          j = json.load(open("docs/analysts.json", encoding="utf-8"))
          for s in j["stocks"]:
              c = s.get("consensus") or {}
              print("==", s["id"], s["name"], "views", len(s["views"]), "summary", s.get("summary"), "yields", s.get("yields"))
              print("   consensus", {k: c.get(k) for k in ("symbol", "n", "mean", "high", "low", "key", "rec")}, "changes", len(c.get("changes") or []))
              if s.get("adr"): print("   adr", {k: s["adr"].get(k) for k in ("symbol", "n", "mean", "key")})
              for v in s["views"][:6]: print("   -", v["date"], v["source"], v["broker"], v["target"], v["stance"], v["title"][:60])
          PY
