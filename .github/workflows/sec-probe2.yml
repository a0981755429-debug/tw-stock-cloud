name: 暫時：SEC 實跑測試
on:
  push:
    branches: [claude/project-thread-djaohg]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          import json
          from datetime import date
          from stockapp import analysts as a
          for sym in a.SEC_CIK:
              try:
                  x = a.sec_filings(sym, date.today())
                  print("==", sym, x["name"], "insider", x["insider"])
                  for f in x["filings"][:8]: print("  ", f["date"], f["form"], "|", f["title"][:90], "|", f["link"][-40:])
              except Exception as e:
                  print("==", sym, "FAIL", e)
          PY
