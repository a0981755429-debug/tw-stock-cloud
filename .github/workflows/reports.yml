name: 盤前 / 盤中分析推播

on:
  schedule:
    # GitHub 免費排程是「盡力而為」：整點最擁擠、常延遲甚至整次被丟掉。
    # 所以每份報告排 3 個時間當備援、避開整點；程式會記錄「今天發過了」，不會重複推播。
    - cron: "45,55 23 * * 0-4"    # 台北 週一~五 07:45 / 07:55 盤前分析（UTC 是前一天）
    - cron: "10 0 * * 1-5"        # 台北 08:10 盤前分析（備援）
    - cron: "45,55 2 * * 1-5"     # 台北 10:45 / 10:55 盤中買賣訊號
    - cron: "10 3 * * 1-5"        # 台北 11:10 盤中買賣訊號（備援）
  workflow_dispatch:              # 手動，或外部排程（cron-job.org）呼叫
    inputs:
      kind:
        description: "要跑哪一份"
        type: choice
        options: [premarket, midday]
        default: premarket
      force:
        description: "不管休市 / 時段 / 今天發過沒都發（測試用）；外部排程請設 false"
        type: boolean
        default: true

permissions:
  contents: write   # 存 state/reports_sent.json（避免重複推播）

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 產生並推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              python -m stockapp.reports "${{ inputs.kind }}" --force
            else
              python -m stockapp.reports "${{ inputs.kind }}"
            fi
          elif [ "$(TZ=Asia/Taipei date +%H)" -lt 9 ]; then
            python -m stockapp.reports premarket
          else
            python -m stockapp.reports midday
          fi
      - name: 存檔（記錄今天已發）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/reports_sent.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "推播紀錄 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase -X theirs origin main && git push
