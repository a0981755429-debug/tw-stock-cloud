name: 盤前 / 盤中分析推播

on:
  schedule:
    - cron: "0 0 * * 1-5"    # 台北 08:00 盤前分析（GitHub 排程常延遲 5~30 分鐘，約 08:05~08:30 收到）
    - cron: "0 4 * * 1-5"    # 台北 12:00 盤中買賣訊號（約 12:05~12:30 收到）
  workflow_dispatch:
    inputs:
      kind:
        description: "要跑哪一份"
        type: choice
        options: [premarket, midday]
        default: premarket

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 產生並推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m stockapp.reports "${{ inputs.kind }}" --force   # 手動：不管休市 / 時段都發（測試用）
          elif [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ]; then
            python -m stockapp.reports premarket
          else
            python -m stockapp.reports midday
          fi
