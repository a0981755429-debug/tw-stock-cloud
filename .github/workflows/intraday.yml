name: 盤中提醒

on:
  schedule:
    - cron: "*/10 1-5 * * 1-5"  # 台北時間 週一~五 09:00~13:50 每 10 分鐘（程式會自己跳過收盤後與休市日）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 檢查到價
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m stockapp.intraday
          else
            python -m stockapp.intraday --force   # 手動執行：不管時段都檢查（測試用）
          fi
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quotes.json state/alerts_sent.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "盤中報價 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase -X theirs origin main && git push   # 同時有別次更新時以這次的新資料為準
