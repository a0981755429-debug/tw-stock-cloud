name: 盤後更新

on:
  schedule:
    # 台北 週一~五 17:50，18:15 / 18:40 備援（GitHub 排程常延遲或被丟；--once 讓推播每天只發一次）
    - cron: "50 9 * * 1-5"
    - cron: "15,40 10 * * 1-5"
  push:
    branches: [main]
    paths: ["watchlist.yml", "analyst_notes.yml"] # 改完自選股 / 收藏觀點就自動重算一次
  workflow_dispatch:         # 可在 Actions 頁面手動按「Run workflow」
    inputs:
      push:
        description: "手動跑也推播 Telegram（測試用）"
        type: boolean
        default: false
      once:
        description: "外部排程（cron-job.org）用：今天發過就跳過；請設 true"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: （選用）永豐 API 套件
        env:
          SJ_API_KEY: ${{ secrets.SJ_API_KEY }}
        run: if [ -n "$SJ_API_KEY" ]; then pip install -q shioaji; fi
      - run: python -m pytest -q
      - name: 抓資料、算訊號、推播
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          JOURNAL_PASS: ${{ secrets.JOURNAL_PASS }}
          SJ_API_KEY: ${{ secrets.SJ_API_KEY }}
          SJ_SECRET_KEY: ${{ secrets.SJ_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.once }}" = "true" ]; then
            python -m stockapp.daily --once
          elif [ "${{ inputs.push }}" = "true" ]; then
            python -m stockapp.daily
          else
            python -m stockapp.daily --no-push   # 手動 / 改自選股時只更新網頁，不推播
          fi
      - name: 分析師觀點（失敗不影響其他資料）
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m stockapp.analysts
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/analysts.json
          git add state/reports_sent.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "盤後資料更新 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase --autostash -X theirs origin main && git push   # 同時有別次更新時以這次的新資料為準
