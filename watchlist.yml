# ============================================================
# 我的自選股（在 GitHub 網頁或手機 App 直接編輯這個檔案，存檔即生效）
#
# 每一檔的格式：
#   - id: "股票代號"          ← 一定要加引號，例如 "0050"
#     note: 備註（可省略）
#     alert:                  ← 價格提醒（可省略，三種擇一或都設）
#       above: 價格           ← 漲到這個價格以上就通知
#       below: 價格           ← 跌到這個價格以下就通知
#       change_pct: 數字      ← 當天漲跌超過幾 % 就通知
#       yield_above: 數字     ← ETF 用：殖利率高於幾 % 就通知（可考慮加碼）
#     next_ex: 2026-11-17     ← ETF 用：下次除息日（可省略；投信公告後會自動抓，這裡只在還沒公告時顯示）
#     next_dps: 1.25          ← ETF 用：下次每股配息（可省略，同上）
# ============================================================

signal_notify: true   # 每天盤後推播自選股的買賣訊號摘要（false = 關閉）

stocks:
  # ---- 持股（股數、成本放在 GitHub Secrets 的 HOLDINGS，不公開）----
  - id: "00878"
    next_ex: 2026-11-17
    next_dps: 1.25
    alert:
      yield_above: 9

  - id: "00919"
    next_ex: 2026-12 中（未公告）
    alert:
      yield_above: 12.5

  # 鴻海：做多＋財報＋波段（2026-11-12）
  - id: "2317"
    note: 核心部位看財報；波段 228 附近買、258 以上賣
    alert:
      below: 228      # 波段買點
      above: 258      # 波段賣點
      change_pct: 4   # 財報、月營收公布後大漲大跌提醒
  - id: "0056"
    alert:
      yield_above: 11

  # ---- 觀察中 ----
  - id: "2330"
    note: 範例，可刪除
    alert:
      change_pct: 5

  - id: "0050"
    alert:
      change_pct: 3
